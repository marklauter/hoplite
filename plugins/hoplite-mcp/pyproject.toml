[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hoplite-catalog"
# Pinned to .claude-plugin/plugin.json and server.SERVER_VERSION by a test.
version = "0.2.0"
description = "The Hoplite catalog MCP server — a frontmatter listing over the corpus"
requires-python = ">=3.12"
# No runtime dependencies, deliberately. `contents` slices text and the stdio host is
# stdlib JSON-RPC, so the plugin runs under whatever Python is on PATH with no venv to
# bootstrap. Adding a dependency here reintroduces that install step for every user.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The ratchet: monotonic, set to the measured value and only ever raised. A scoped run
# passes --no-cov, since a subset of the suite cannot meet a project-wide floor.
addopts = "--cov=src --cov-branch --cov-fail-under=95"

[tool.coverage.report]
exclude_also = [
    # Unreachable by construction: `assert_never` is how a new variant becomes a pyright
    # error, so the line executing would mean the type check had already failed.
    "assert_never\\(",
    # The entry-point guard runs under the interpreter, never under pytest.
    "if __name__ == .__main__.:",
    # Import-time only; the block has no runtime behavior to test.
    "if TYPE_CHECKING:",
]

[tool.importlinter]
root_packages = ["hoplite_catalog"]

# The dependency direction, asserted by tests/test_architecture.py so it runs in the same
# pytest step as everything else. `server` is the composition root and the only module that
# may name the real filesystem; `adapters` sits above the core so `contents` and
# `vocabulary` cannot import it, which is what makes `ports` a boundary rather than a
# suggestion; `corpus` pairs a port with a resolved root and is the only thing the walk
# holds; `ports` is the port and depends on nothing local. `exhaustive` makes a new module
# a failure until it is placed in the layering deliberately.
[[tool.importlinter.contracts]]
name = "The package layers in one direction"
type = "layers"
layers = ["server", "adapters", "vocabulary", "contents", "corpus", "ports"]
containers = ["hoplite_catalog"]
exhaustive = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

# Tests read JSON-RPC envelopes, which are `dict[str, Any]` by nature; the strict-mode
# unknown-type reports fire on every subscript. Real type errors still surface here.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
